version: '3.8'

# Development helper: Spins up PostgreSQL only, so you can run pnpm dev on your machine!
services:
  postgres:
    image: postgres:16-alpine
    container_name: kopipos_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kopipos
    ports:
      - '5432:5432'
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

volumes:
  dev_postgres_data:
